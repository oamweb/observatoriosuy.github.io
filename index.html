<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos próximos</title>
  <style>
    body {
      background: url('https://c0.wallpaperflare.com/preview/301/521/245/stars-at-night-time.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      font-family: Arial, sans-serif;
    }

    .event-list, .filter-buttons {
      text-align: center;
      margin-top: 20px;
    }

    .event-button, .filter-buttons button {
      margin: 5px;
      padding: 10px 16px;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .event-button {
      background-color: #4CAF50;
    }

    .event-button:hover {
      background-color: #45a049;
    }

    .filter-buttons button {
      background-color: #2196F3;
    }

    .filter-buttons button:hover {
      background-color: #1976D2;
    }

    .event-button.red {
      background-color: red !important;
    }

    .event-button.yellow {
      background-color: #FFC107;
    }

    .event-details {
      display: none;
      margin: 20px auto;
      width: 80%;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 5px;
      text-align: left;
    }

    .event-details img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
      margin-top: 10px;
    }

    .back-button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #f44336;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      display: block;
      width: fit-content;
    }

    .back-button:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <div class="filter-buttons"></div>
  <div class="event-list"></div>
  <div class="event-details"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
  const apiURL = 'https://sheetdb.io/api/v1/0wwv7l0dnhiwr';
  let eventData = [];

  function getDataFromApi() {
    axios.get(apiURL)
      .then(response => {
        eventData = response.data;
        generateFilterButtons(eventData);
      })
      .catch(error => {
        console.error('Error al obtener datos:', error);
        document.querySelector('.filter-buttons').innerHTML = '<p>Error al cargar eventos.</p>';
      });
  }

  function generateFilterButtons(data) {
    const uniqueDepartments = [...new Set(data.map(item => item.Departamento))].sort();
    const filterButtonsContainer = document.querySelector('.filter-buttons');
    filterButtonsContainer.innerHTML = '';

    uniqueDepartments.forEach(department => {
      const button = document.createElement('button');
      button.textContent = department;
      button.onclick = function() {
        filterEventsByDepartment(department);
      };
      filterButtonsContainer.appendChild(button);
    });
  }

  function filterEventsByDepartment(department) {
    const filteredEvents = eventData.filter(row => row.Departamento === department);
    const groupedEvents = groupEventsByKey(filteredEvents);
    displayEventButtons(groupedEvents);
  }

  function groupEventsByKey(events) {
    const eventMap = new Map();

    events.forEach(event => {
      const key = `${event.Departamento}-${event.Ciudad}-${event.Numero}`;
      if (!eventMap.has(key)) {
        eventMap.set(key, []);
      }
      eventMap.get(key).push(event);
    });

    eventMap.forEach(eventList => {
      eventList.sort((a, b) => getDate(b["Marca temporal"]) - getDate(a["Marca temporal"]));
    });

    return Array.from(eventMap.values());
  }

  function getDate(dateString) {
    if (!dateString || dateString.trim() === '') return new Date(0);
    const formattedDate = dateString.replace(/(\d+)\/(\d+)\/(\d+) (\d+:\d+:\d+)/, '$2/$1/$3 $4');
    return new Date(formattedDate);
  }

  function displayEventButtons(events) {
    const eventList = document.querySelector('.event-list');
    eventList.innerHTML = '';

    events.forEach(eventVersions => {
      const latestEvent = eventVersions[0];
      const button = document.createElement('button');
      button.classList.add('event-button');
      button.textContent = `${latestEvent.Ciudad} - ${latestEvent.Numero || 'N/A'}`;

      const latestDate = getDate(latestEvent["Marca temporal"]);
      const currentYear = new Date().getFullYear();
      const isOld = latestDate.getFullYear() > 1970 && latestDate.getFullYear() < currentYear;

      if (isOld) {
        button.classList.add('red');
      }

      button.onclick = function() {
        displayEventDetails(latestEvent, eventVersions);
      };
      eventList.appendChild(button);
    });
  }

  function displayEventDetails(event, eventVersions) {
    const eventDetailsContainer = document.querySelector('.event-details');
    eventDetailsContainer.style.display = 'block';

    let versionsList = '<p><strong>Versiones:</strong></p>';
    eventVersions.forEach(version => {
      const dateText = version["Marca temporal"] ? version["Marca temporal"] : 'Sin fecha';
      versionsList += `<p><a href="#" onclick='displayEventDetails(${JSON.stringify(version)}, ${JSON.stringify(eventVersions)})'>${dateText}</a></p>`;
    });

    eventDetailsContainer.innerHTML = `
      <p><strong>${event.Ciudad}</strong></p>
      <p><strong>Número:</strong> ${event.Numero || 'N/A'}</p>
      <p><strong>Fecha:</strong> ${event["Marca temporal"] || 'Sin fecha registrada'}</p>
      <p><strong>Docentes:</strong> ${event.Docentes || 'No disponible'}</p>
      <p><strong>Telescopio:</strong> ${event.Telescopio || 'No disponible'}</p>
      <p><strong>Accesorios:</strong> ${event.Accesorios || 'No disponible'}</p>
      <p><strong>Horario:</strong> ${event.Horario || 'No disponible'}</p>
      <p><strong>Descripción:</strong> ${event.Descripción || 'No disponible'}</p>
      ${event.Fotos ? `<img src="${event.Fotos}" alt="${event.Ciudad}">` : ''}
      ${versionsList}
      <button class="back-button" onclick="hideEventDetails()">Volver</button>
    `;
  }

  function hideEventDetails() {
    document.querySelector('.event-details').style.display = 'none';
  }

  window.onload = getDataFromApi;
</script>

</body>
</html>
