<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos próximos</title>
  <style>
    body {
      background: url('https://c0.wallpaperflare.com/preview/301/521/245/stars-at-night-time.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      font-family: Arial, sans-serif;
    }

    .event-list, .filter-buttons {
      text-align: center;
      margin-top: 20px;
    }

    .event-list div {
      margin-bottom: 10px;
    }

    .event-button, .filter-buttons button {
      margin: 5px;
      padding: 10px 16px;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .event-button {
      background-color: #4CAF50;
    }

    .event-button:hover {
      background-color: #45a049;
    }

    .filter-buttons button {
      background-color: #2196F3;
    }

    .filter-buttons button:hover {
      background-color: #1976D2;
    }

    .event-details {
      display: none;
      margin: 20px auto;
      width: 80%;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 5px;
      text-align: left;
    }

    .event-details img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
      margin-top: 10px;
    }

    .back-button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #f44336;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      display: block;
      width: fit-content;
    }

    .back-button:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <div class="filter-buttons"></div>
  <div class="event-list"></div>
  <div class="event-details"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const apiURL = 'https://sheetdb.io/api/v1/0wwv7l0dnhiwr';
    let eventData = [];

    function getDataFromApi() {
      axios.get(apiURL)
        .then(response => {
          eventData = response.data;
          generateFilterButtons(eventData);
        })
        .catch(error => {
          console.error('Error al obtener datos:', error);
          document.querySelector('.filter-buttons').innerHTML = '<p>Error al cargar eventos.</p>';
        });
    }

    function generateFilterButtons(data) {
      const uniqueDepartments = [...new Set(data.map(item => item.Departamento))].sort();
      const filterButtonsContainer = document.querySelector('.filter-buttons');
      filterButtonsContainer.innerHTML = '';

      uniqueDepartments.forEach(department => {
        const button = document.createElement('button');
        button.textContent = department;
        button.onclick = function() {
          filterEventsByDepartment(department);
        };
        filterButtonsContainer.appendChild(button);
      });
    }

    function filterEventsByDepartment(department) {
      const filteredEvents = eventData.filter(row => row.Departamento === department);
      const uniqueEvents = getMostRecentEvents(filteredEvents);
      displayEventButtons(uniqueEvents);
    }

    function getMostRecentEvents(events) {
      const eventMap = new Map();

      events.forEach(event => {
        const key = `${event.Departamento}-${event.Ciudad}-${event.Numero}`;
        const eventDate = parseDate(event["Marca temporal"]);

        if (!eventMap.has(key)) {
          eventMap.set(key, []);
        }

        eventMap.get(key).push({ ...event, eventDate });
      });

      eventMap.forEach(eventList => {
        eventList.sort((a, b) => {
          if (a.eventDate === null && b.eventDate !== null) return 1;
          if (a.eventDate !== null && b.eventDate === null) return -1;
          return (b.eventDate || 0) - (a.eventDate || 0);
        });

        const hasNoDate = eventList.some(e => e.eventDate === null);
        if (hasNoDate) {
          const filteredEvents = eventList.filter(e => e.eventDate !== null);
          const firstNoDateEvent = eventList.find(e => e.eventDate === null);
          if (firstNoDateEvent) filteredEvents.push(firstNoDateEvent);
          eventMap.set(eventList[0].key, filteredEvents);
        }
      });

      return eventMap;
    }

    function parseDate(dateString) {
      if (!dateString || dateString.trim() === '') return null;
      const formattedDate = dateString.replace(/(\d+)\/(\d+)\/(\d+) (\d+:\d+:\d+)/, '$2/$1/$3 $4');
      const parsedDate = new Date(formattedDate);
      return isNaN(parsedDate) ? null : parsedDate;
    }

    function displayEventButtons(eventsMap) {
      const eventList = document.querySelector('.event-list');
      eventList.innerHTML = '';

      eventsMap.forEach((eventVersions) => {
        const mostRecentEvent = eventVersions[0];
        const eventButton = document.createElement('button');
        eventButton.classList.add('event-button');
        eventButton.textContent = `${mostRecentEvent.Ciudad} - ${mostRecentEvent.Numero || 'N/A'}`;

        eventButton.onclick = function() {
          displayEventDetails(eventVersions);
        };

        eventList.appendChild(eventButton);
      });
    }

    function displayEventDetails(eventVersions) {
      const eventDetailsContainer = document.querySelector('.event-details');
      eventDetailsContainer.style.display = 'block';
      const mostRecentEvent = eventVersions[0];

      let detailsHTML = `
        <p><strong>${mostRecentEvent.Ciudad}</strong></p>
        <p><strong>Número:</strong> ${mostRecentEvent.Numero || 'N/A'}</p>
        <p><strong>Fecha:</strong> ${mostRecentEvent["Marca temporal"] || 'Sin fecha registrada'}</p>
        <p><strong>Docentes:</strong> ${mostRecentEvent.Docentes || 'No disponible'}</p>
        <p><strong>Telescopio:</strong> ${mostRecentEvent.Telescopio || 'No disponible'}</p>
        <p><strong>Accesorios:</strong> ${mostRecentEvent.Accesorios || 'No disponible'}</p>
        <p><strong>Horario:</strong> ${mostRecentEvent.Horario || 'No disponible'}</p>
        <p><strong>Descripción:</strong> ${mostRecentEvent.Descripción || 'No disponible'}</p>
        ${mostRecentEvent.Fotos ? `<img src="${mostRecentEvent.Fotos}" alt="${mostRecentEvent.Ciudad}">` : ''}
        <button class="back-button" onclick="hideEventDetails()">Volver</button>
      `;

      if (eventVersions.length > 1) {
        detailsHTML += `<h3>Versiones anteriores:</h3><ul>`;
        eventVersions.slice(1).forEach(event => {
          detailsHTML += `<li>
            <button onclick="displayEventDetails([event])">
              ${event["Marca temporal"] || 'Sin fecha'}
            </button>
          </li>`;
        });
        detailsHTML += `</ul>`;
      }

      eventDetailsContainer.innerHTML = detailsHTML;
    }

    function hideEventDetails() {
      document.querySelector('.event-details').style.display = 'none';
    }

    window.onload = getDataFromApi;
  </script>

</body>
</html>
