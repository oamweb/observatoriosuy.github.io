<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos próximos</title>
  <style>
    body {
      background: url('https://c0.wallpaperflare.com/preview/301/521/245/stars-at-night-time.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      font-family: Arial, sans-serif;
    }

    .event-list, .filter-buttons {
      text-align: center;
      margin-top: 20px;
    }

    .event-button, .filter-buttons button {
      margin: 5px;
      padding: 10px 16px;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .event-button { background-color: #4CAF50; }
    .event-button:hover { background-color: #45a049; }
    .filter-buttons button { background-color: #2196F3; }
    .filter-buttons button:hover { background-color: #1976D2; }
    
    .event-button.red { background-color: red; }
    .event-button.yellow { background-color: #FFC107; }
    .event-button.blue { background-color: blue; }
    .event-button.green { background-color: green; }

    .event-details {
      display: none;
      margin: 20px auto;
      width: 80%;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 5px;
      text-align: left;
    }

    .event-details img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
      margin-top: 10px;
    }

    .back-button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #f44336;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      display: block;
      width: fit-content;
    }

    .back-button:hover { background-color: #d32f2f; }
  </style>
</head>
<body>

  <div class="filter-buttons"></div>
  <div class="event-list"></div>
  <div class="event-details"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const apiURL = 'https://sheetdb.io/api/v1/lzahnx5965cxk';
    let eventData = [];

    function getDataFromApi() {
      axios.get(apiURL)
        .then(response => {
          eventData = response.data;
          generateFilterButtons(eventData);
        })
        .catch(error => {
          console.error('Error al obtener datos:', error);
          document.querySelector('.filter-buttons').innerHTML = '<p>Error al cargar eventos.</p>';
        });
    }

    function generateFilterButtons(data) {
      const uniqueDepartments = [...new Set(data.map(item => item.Departamento))].sort();
      const filterButtonsContainer = document.querySelector('.filter-buttons');
      filterButtonsContainer.innerHTML = '';

      uniqueDepartments.forEach(department => {
        const button = document.createElement('button');
        button.textContent = department;
        button.onclick = function() {
          filterEventsByDepartment(department);
        };
        filterButtonsContainer.appendChild(button);
      });
    }

    function filterEventsByDepartment(department) {
      const filteredEvents = eventData.filter(row => row.Departamento === department);
      const groupedEvents = groupEventsByMostRecent(filteredEvents);
      displayEventButtons(groupedEvents);
    }

    function groupEventsByMostRecent(events) {
      const eventMap = new Map();

      events.forEach(event => {
        const eventNumber = event["Número de liceo"] && event["Número de liceo"].trim() !== '' ? event["Número de liceo"] : 'Desconocido';
        const key = `${event.Departamento}-${event.Ciudad}-${eventNumber}`;
        const existingEvents = eventMap.get(key) || [];

        let eventDate = parseDate(event["Marca temporal"]);
        existingEvents.push({ ...event, eventDate, Numero: eventNumber });

        eventMap.set(key, existingEvents);
      });

      return Array.from(eventMap.values()).map(eventList => {
        eventList.sort((a, b) => (b.eventDate || 0) - (a.eventDate || 0));
        return eventList;
      });
    }

    function parseDate(dateStr) {
      if (!dateStr || dateStr.trim() === '') return null;
      return new Date(dateStr.replace(/(\d+)\/(\d+)\/(\d+) (\d+:\d+:\d+)/, '$2/$1/$3 $4'));
    }

    function displayEventButtons(eventGroups) {
      const eventList = document.querySelector('.event-list');
      eventList.innerHTML = '';

      if (eventGroups.length === 0) {
        eventList.innerHTML = '<p>No hay eventos en este departamento.</p>';
        return;
      }

      eventGroups.sort((a, b) => {
        if (a[0].Ciudad < b[0].Ciudad) return -1;
        if (a[0].Ciudad > b[0].Ciudad) return 1;

        const numA = parseInt(a[0]["Número de liceo"], 10) || 0;
        const numB = parseInt(b[0]["Número de liceo"], 10) || 0;

        return numA - numB;
      });

      const currentYear = new Date().getFullYear();

      eventGroups.forEach(events => {
        const latestEvent = events[0];
        const eventButton = document.createElement('button');
        eventButton.classList.add('event-button');
        eventButton.textContent = `${latestEvent.Ciudad} - ${latestEvent["Número de liceo"]}`;

        if (!latestEvent.Telescopio && !latestEvent.Accesorios && !latestEvent.Horario && !latestEvent["Otros"]) {
          eventButton.classList.add('red');
        } else if (latestEvent.Atención && latestEvent.Atención.trim() !== '') {
          eventButton.classList.add('yellow');
        } else if (latestEvent.eventDate && latestEvent.eventDate.getFullYear() === currentYear) {
          eventButton.classList.add('blue');
        } else {
          eventButton.classList.add('green');
        }

        eventButton.onclick = function() {
          displayEventDetails(events, latestEvent);
        };
        eventList.appendChild(eventButton);
      });
    }

    function displayEventDetails(eventVersions, selectedEvent) {
      const eventDetailsContainer = document.querySelector('.event-details');
      eventDetailsContainer.style.display = 'block';

      let detailsHTML = `
        <p><strong>${selectedEvent.Ciudad}</strong></p>
        <p><strong>Número:</strong> ${selectedEvent["Número de liceo"]}</p>
        <p><strong>Fecha:</strong> ${selectedEvent["Marca temporal"] || 'Sin fecha registrada'}</p>
        <p><strong>Docentes:</strong> ${selectedEvent["Docentes y contacto"] || 'No disponible'}</p>
        <p><strong>Telescopio:</strong> ${selectedEvent.Telescopio || 'No disponible'}</p>
        <p><strong>Accesorios:</strong> ${selectedEvent.Accesorios || 'No disponible'}</p>
        <p><strong>Horario:</strong> ${selectedEvent.Horario || 'No disponible'}</p>
        <p><strong>Otros:</strong> ${selectedEvent["Otros"] || 'No disponible'}</p>
      `;

      detailsHTML += `<button class="back-button" onclick="hideEventDetails()">Volver</button>`;
      eventDetailsContainer.innerHTML = detailsHTML;
    }

    function hideEventDetails() {
      document.querySelector('.event-details').style.display = 'none';
    }

    window.onload = getDataFromApi;
  </script>

</body>
</html>
