<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos próximos</title>

  <style>
    body {
      background: url('https://c0.wallpaperflare.com/preview/301/521/245/stars-at-night-time.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      font-family: Arial, sans-serif;
    }

    .event-list,
    .filter-buttons {
      text-align: center;
      margin-top: 20px;
    }

    .event-button,
    .filter-buttons button,
    .version-button {
      margin: 5px;
      padding: 10px 16px;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .event-button {
      background-color: #4CAF50;
    }

    .event-button:hover {
      background-color: #45a049;
    }

    .filter-buttons button {
      background-color: #2196F3;
    }

    .filter-buttons button:hover {
      background-color: #1976D2;
    }

    .event-button.red {
      background-color: red;
    }

    .event-button.blue {
      background-color: blue;
    }

    .event-button.black {
      background-color: black;
    }

    .version-button {
      background-color: #666;
      font-size: 14px;
      padding: 6px 10px;
    }

    .version-button:hover {
      background-color: #888;
    }

    .event-details {
      display: none;
      margin: 20px auto;
      width: 80%;
      background-color: rgba(0, 0, 0, 0.85);
      padding: 15px;
      border-radius: 5px;
      text-align: left;
    }

    .back-button {
      margin-top: 15px;
      padding: 8px 16px;
      background-color: #f44336;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      display: block;
      width: fit-content;
    }

    .back-button:hover {
      background-color: #d32f2f;
    }

    .versions-container {
      margin-top: 20px;
    }

    .versions-container ul {
      padding-left: 20px;
    }

    .versions-container li {
      margin-bottom: 8px;
    }

    .error-message {
      text-align: center;
      margin: 30px auto;
      padding: 20px;
      width: 80%;
      background-color: rgba(180, 0, 0, 0.85);
      border-radius: 5px;
    }

    .loading-message {
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="filter-buttons"></div>

  <div class="event-list">
    <div class="loading-message">
      Cargando datos...
    </div>
  </div>

  <div class="event-details"></div>


  <script>

    /*
     * ============================================================
     * ARCHIVO DE DATOS
     * ============================================================
     *
     * eventos.csv debe estar en la misma carpeta que index.html
     *
     * Ejemplo:
     *
     * repositorio/
     * ├── index.html
     * └── eventos.csv
     *
     */

    const csvURL = './eventos.csv';

    let eventData = [];


    /*
     * ============================================================
     * CARGAR CSV
     * ============================================================
     */

    async function getDataFromFile() {

      try {

        const response = await fetch(csvURL);

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const csvText = await response.text();

        eventData = parseCSV(csvText);

        console.log(
          `Datos cargados correctamente: ${eventData.length} registros`
        );

        if (eventData.length === 0) {
          throw new Error(
            'El archivo CSV no contiene registros.'
          );
        }

        generateFilterButtons(eventData);

      } catch (error) {

        console.error(
          'Error al cargar eventos.csv:',
          error
        );

        document.querySelector(
          '.event-list'
        ).innerHTML = `
          <div class="error-message">
            <strong>Error al cargar los datos</strong>
            <br><br>
            No se pudo cargar <strong>eventos.csv</strong>.
            <br><br>
            Comprueba que el archivo esté en la misma carpeta
            que <strong>index.html</strong>.
            <br><br>
            <small>
              ${escapeHTML(error.message)}
            </small>
          </div>
        `;
      }
    }


    /*
     * ============================================================
     * PARSER CSV
     * ============================================================
     *
     * Este parser soporta:
     *
     * - Campos separados por coma
     * - Campos entre comillas
     * - Comas dentro de campos
     * - Saltos de línea dentro de campos
     * - Comillas dobles escapadas
     * - UTF-8
     *
     * Es necesario porque el CSV descargado desde Google
     * contiene campos con textos multilínea.
     */

    function parseCSV(csv) {

      const rows = [];

      let row = [];
      let field = '';

      let insideQuotes = false;


      for (let i = 0; i < csv.length; i++) {

        const char = csv[i];
        const nextChar = csv[i + 1];


        /*
         * Comillas
         */

        if (char === '"') {

          /*
           * Dos comillas dentro de un campo
           * representan una comilla real.
           */

          if (
            insideQuotes &&
            nextChar === '"'
          ) {

            field += '"';

            i++;

          } else {

            insideQuotes =
              !insideQuotes;

          }

        }


        /*
         * Separador de columnas
         */

        else if (
          char === ',' &&
          !insideQuotes
        ) {

          row.push(field);

          field = '';

        }


        /*
         * Fin de fila
         */

        else if (
          (char === '\n' ||
           char === '\r') &&
          !insideQuotes
        ) {

          /*
           * Windows usa \r\n.
           */

          if (
            char === '\r' &&
            nextChar === '\n'
          ) {
            i++;
          }

          row.push(field);

          field = '';


          /*
           * Ignorar filas completamente vacías.
           */

          if (
            row.some(
              value =>
                value.trim() !== ''
            )
          ) {

            rows.push(row);

          }

          row = [];

        }


        /*
         * Cualquier otro carácter
         */

        else {

          field += char;

        }
      }


      /*
       * Procesar la última fila.
       */

      if (
        field !== '' ||
        row.length > 0
      ) {

        row.push(field);

        if (
          row.some(
            value =>
              value.trim() !== ''
          )
        ) {

          rows.push(row);

        }
      }


      /*
       * Si no hay datos.
       */

      if (rows.length === 0) {
        return [];
      }


      /*
       * La primera fila contiene
       * los nombres de las columnas.
       */

      const headers =
        rows[0].map(
          header =>
            header
              .trim()
              .replace(/^\uFEFF/, '')
        );


      /*
       * Convertir las filas en objetos.
       */

      return rows
        .slice(1)
        .map(row => {

          const object = {};

          headers.forEach(
            (header, index) => {

              object[header] =
                row[index] !== undefined
                  ? row[index].trim()
                  : '';

            }
          );

          return object;

        });
    }


    /*
     * ============================================================
     * BOTONES DE DEPARTAMENTOS
     * ============================================================
     */

    function generateFilterButtons(data) {

      const uniqueDepartments =
        [
          ...new Set(
            data
              .map(
                item =>
                  item.Departamento
              )
              .filter(Boolean)
          )
        ].sort(
          (a, b) =>
            a.localeCompare(
              b,
              'es'
            )
        );


      const filterButtonsContainer =
        document.querySelector(
          '.filter-buttons'
        );


      filterButtonsContainer.innerHTML = '';


      uniqueDepartments.forEach(
        department => {

          const button =
            document.createElement(
              'button'
            );

          button.textContent =
            department;


          button.onclick =
            function () {

              filterEventsByDepartment(
                department
              );

            };


          filterButtonsContainer
            .appendChild(button);

        }
      );
    }


    /*
     * ============================================================
     * FILTRAR POR DEPARTAMENTO
     * ============================================================
     */

    function filterEventsByDepartment(
      department
    ) {

      const filteredEvents =
        eventData.filter(
          row =>
            row.Departamento ===
            department
        );


      const groupedEvents =
        groupEventsByMostRecent(
          filteredEvents
        );


      displayEventButtons(
        groupedEvents
      );
    }


    /*
     * ============================================================
     * AGRUPAR VERSIONES
     * ============================================================
     *
     * Cada combinación:
     *
     * Departamento + Localidad + Número de liceo
     *
     * representa un mismo lugar.
     *
     * Si existen varias respuestas para ese lugar,
     * se muestran como versiones.
     */

    function groupEventsByMostRecent(
      events
    ) {

      const eventMap =
        new Map();


      events.forEach(
        event => {

          const eventNumber =
            event["Número de liceo"] &&
            event["Número de liceo"]
              .trim() !== ''
              ? event["Número de liceo"]
                  .trim()
              : 'Desconocido';


          const key =
            `${event.Departamento}-${event.Localidad}-${eventNumber}`;


          const existingEvents =
            eventMap.get(key) || [];


          const eventDate =
            parseDate(
              event["Marca temporal"]
            );


          existingEvents.push({

            ...event,

            eventDate

          });


          eventMap.set(
            key,
            existingEvents
          );

        }
      );


      /*
       * Ordenar cada grupo de versiones
       * desde la más reciente a la más antigua.
       */

      return Array
        .from(
          eventMap.values()
        )
        .map(
          eventList => {

            eventList.sort(
              (a, b) => {

                if (
                  !a.eventDate &&
                  !b.eventDate
                ) {
                  return 0;
                }

                if (!a.eventDate) {
                  return 1;
                }

                if (!b.eventDate) {
                  return -1;
                }

                return (
                  b.eventDate -
                  a.eventDate
                );

              }
            );

            return eventList;

          }
        );
    }


    /*
     * ============================================================
     * PARSEAR FECHAS
     * ============================================================
     *
     * El CSV contiene fechas como:
     *
     * 7/5/2026
     *
     * y:
     *
     * 26/12/2026 17:57:47
     *
     */

    function parseDate(dateStr) {

      if (
        !dateStr ||
        dateStr.trim() === ''
      ) {

        return null;

      }


      try {

        const parts =
          dateStr
            .trim()
            .split(/\s+/);


        const datePart =
          parts[0];


        const timePart =
          parts[1] ||
          '00:00:00';


        const dateComponents =
          datePart
            .split('/')
            .map(Number);


        if (
          dateComponents.length !== 3
        ) {

          return null;

        }


        const [
          day,
          month,
          year
        ] = dateComponents;


        const timeComponents =
          timePart
            .split(':')
            .map(Number);


        const hours =
          timeComponents[0] || 0;

        const minutes =
          timeComponents[1] || 0;

        const seconds =
          timeComponents[2] || 0;


        const parsedDate =
          new Date(
            year,
            month - 1,
            day,
            hours,
            minutes,
            seconds
          );


        if (
          isNaN(
            parsedDate.getTime()
          )
        ) {

          return null;

        }


        return parsedDate;

      } catch (error) {

        console.error(
          'Error parseando fecha:',
          dateStr,
          error
        );

        return null;

      }
    }


    /*
     * ============================================================
     * MOSTRAR BOTONES DE EVENTOS
     * ============================================================
     */

    function displayEventButtons(
      eventGroups
    ) {

      const eventList =
        document.querySelector(
          '.event-list'
        );


      eventList.innerHTML = '';


      const currentYear =
        new Date()
          .getFullYear();


      /*
       * Ordenar:
       *
       * 1. Localidad
       * 2. Número de liceo
       */

      eventGroups.sort(
        (a, b) => {

          const cityA =
            a[0].Localidad || '';

          const cityB =
            b[0].Localidad || '';


          const cityCompare =
            cityA.localeCompare(
              cityB,
              'es'
            );


          if (
            cityCompare !== 0
          ) {

            return cityCompare;

          }


          const numA =
            parseInt(
              a[0]["Número de liceo"]
            ) || 0;


          const numB =
            parseInt(
              b[0]["Número de liceo"]
            ) || 0;


          return numA - numB;

        }
      );


      /*
       * Crear botón para cada lugar.
       */

      eventGroups.forEach(
        events => {

          /*
           * El primer elemento es la
           * versión más reciente.
           */

          const latestEvent =
            events[0];


          const eventButton =
            document.createElement(
              'button'
            );


          eventButton.classList.add(
            'event-button'
          );


          eventButton.textContent =
            `${latestEvent.Localidad || 'Sin localidad'} - ${latestEvent["Número de liceo"] || 'Desconocido'}`;


          /*
           * ======================================================
           * COLOR NEGRO
           * ======================================================
           *
           * Si Docente/s dice CERRADO.
           */

          if (
            latestEvent["Docente/s"] &&
            latestEvent["Docente/s"]
              .toString()
              .trim()
              .toUpperCase() ===
              'CERRADO'
          ) {

            eventButton.classList.add(
              'black'
            );

          }


          /*
           * ======================================================
           * COLOR ROJO
           * ======================================================
           *
           * Si no hay información en:
           *
           * Telescopio principal
           * Accesorios
           * Horarios
           * Otros
           */

          else if (
            !hasValue(
              latestEvent[
                "Telescopio principal"
              ]
            ) &&
            !hasValue(
              latestEvent[
                "Accesorios"
              ]
            ) &&
            !hasValue(
              latestEvent[
                "Horarios por docente en el observatorio"
              ]
            ) &&
            !hasValue(
              latestEvent[
                "Otros"
              ]
            )
          ) {

            eventButton.classList.add(
              'red'
            );

          }


          /*
           * ======================================================
           * COLOR AZUL
           * ======================================================
           *
           * Si el registro más reciente
           * pertenece al año actual.
           */

          else if (
            latestEvent.eventDate &&
            latestEvent.eventDate
              .getFullYear() ===
              currentYear
          ) {

            eventButton.classList.add(
              'blue'
            );

          }


          /*
           * Al hacer clic,
           * mostrar los detalles.
           */

          eventButton.onclick =
            function () {

              displayEventDetails(
                events,
                latestEvent
              );

            };


          eventList.appendChild(
            eventButton
          );

        }
      );
    }


    /*
     * ============================================================
     * COMPROBAR SI UN CAMPO TIENE CONTENIDO
     * ============================================================
     */

    function hasValue(value) {

      return (
        value !== undefined &&
        value !== null &&
        value.toString().trim() !== ''
      );

    }


    /*
     * ============================================================
     * MOSTRAR DETALLES DEL EVENTO
     * ============================================================
     */

    function displayEventDetails(
      eventVersions,
      selectedEvent
    ) {

      const eventDetailsContainer =
        document.querySelector(
          '.event-details'
        );


      eventDetailsContainer.style.display =
        'block';


      let detailsHTML = '';


      /*
       * Información principal.
       */

      detailsHTML += `

        <p>
          <strong>
            ${escapeHTML(
              selectedEvent.Localidad ||
              ''
            )}
          </strong>
        </p>

        <p>
          <strong>Número:</strong>
          ${escapeHTML(
            selectedEvent[
              "Número de liceo"
            ] ||
            'Desconocido'
          )}
        </p>

        <p>
          <strong>Fecha:</strong>
          ${escapeHTML(
            selectedEvent[
              "Marca temporal"
            ] ||
            'Sin fecha registrada'
          )}
        </p>

      `;


      /*
       * Mostrar todos los demás campos
       * del CSV.
       */

      Object.keys(
        selectedEvent
      ).forEach(
        key => {

          /*
           * Estos campos ya se muestran arriba.
           */

          if (
            [
              "Marca temporal",
              "Departamento",
              "Localidad",
              "Número de liceo",
              "eventDate"
            ].includes(key)
          ) {

            return;

          }


          const value =
            selectedEvent[key];


          detailsHTML += `

            <p>

              <strong>
                ${escapeHTML(key)}:
              </strong>

              ${hasValue(value)
                ? escapeHTML(value)
                : 'No disponible'
              }

            </p>

          `;

        }
      );


      /*
       * ==========================================================
       * VERSIONES
       * ==========================================================
       */

      if (
        eventVersions.length > 1
      ) {

        detailsHTML += `

          <div class="versions-container">

            <h3>
              Versiones:
            </h3>

            <ul>

        `;


        eventVersions.forEach(
          (event, index) => {

            detailsHTML += `

              <li>

                <button
                  class="version-button"
                  data-version-index="${index}"
                >
                  ${escapeHTML(
                    event[
                      "Marca temporal"
                    ] ||
                    'Sin fecha'
                  )}
                </button>

              </li>

            `;

          }
        );


        detailsHTML += `

            </ul>

          </div>

        `;

      }


      /*
       * Botón volver.
       */

      detailsHTML += `

        <button
          class="back-button"
          onclick="hideEventDetails()"
        >
          Volver
        </button>

      `;


      eventDetailsContainer.innerHTML =
        detailsHTML;


      /*
       * ==========================================================
       * BOTONES DE VERSIONES
       * ==========================================================
       */

      const versionButtons =
        eventDetailsContainer
          .querySelectorAll(
            '.version-button'
          );


      versionButtons.forEach(
        button => {

          button.addEventListener(
            'click',
            function () {

              const index =
                parseInt(
                  this.dataset
                    .versionIndex
                );


              displayEventDetails(
                eventVersions,
                eventVersions[index]
              );

            }
          );

        }
      );
    }


    /*
     * ============================================================
     * OCULTAR DETALLES
     * ============================================================
     */

    function hideEventDetails() {

      document.querySelector(
        '.event-details'
      ).style.display = 'none';

    }


    /*
     * ============================================================
     * ESCAPAR HTML
     * ============================================================
     *
     * Evita que un texto contenido en el CSV
     * pueda interpretarse como código HTML.
     */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return '';

      }


      return String(value)
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );
    }


    /*
     * ============================================================
     * INICIAR PÁGINA
     * ============================================================
     */

    window.onload =
      getDataFromFile;

  </script>

</body>
</html>
