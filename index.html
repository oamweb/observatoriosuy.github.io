<script>
  const apiURL = 'https://sheetdb.io/api/v1/0wwv7l0dnhiwr';
  let eventData = [];

  function getDataFromApi() {
    axios.get(apiURL)
      .then(response => {
        eventData = response.data;
        generateFilterButtons(eventData);
      })
      .catch(error => {
        console.error('Error al obtener datos:', error);
        document.querySelector('.filter-buttons').innerHTML = '<p>Error al cargar eventos.</p>';
      });
  }

  function generateFilterButtons(data) {
    const uniqueDepartments = [...new Set(data.map(item => item.Departamento))].sort();
    const filterButtonsContainer = document.querySelector('.filter-buttons');
    filterButtonsContainer.innerHTML = '';

    uniqueDepartments.forEach(department => {
      const button = document.createElement('button');
      button.textContent = department;
      button.onclick = function() {
        filterEventsByDepartment(department);
      };
      filterButtonsContainer.appendChild(button);
    });
  }

  function filterEventsByDepartment(department) {
    const filteredEvents = eventData.filter(row => row.Departamento === department);
    const uniqueEvents = getMostRecentEvents(filteredEvents);
    displayEventButtons(uniqueEvents);
  }

  function getMostRecentEvents(events) {
    const eventMap = new Map();

    events.forEach(event => {
      const key = `${event.Departamento}-${event.Ciudad}-${event.Numero}`;
      const existingEvent = eventMap.get(key);
      
      // Validar si "Marca temporal" tiene un valor
      let eventDate = null;
      if (event["Marca temporal"] && event["Marca temporal"].trim() !== '') {
        const formattedDate = event["Marca temporal"].replace(/(\d+)\/(\d+)\/(\d+) (\d+:\d+:\d+)/, '$2/$1/$3 $4');
        eventDate = new Date(formattedDate);
      }

      let existingDate = null;
      if (existingEvent && existingEvent["Marca temporal"] && existingEvent["Marca temporal"].trim() !== '') {
        const formattedDate = existingEvent["Marca temporal"].replace(/(\d+)\/(\d+)\/(\d+) (\d+:\d+:\d+)/, '$2/$1/$3 $4');
        existingDate = new Date(formattedDate);
      }

      // Si no hay evento previo o el nuevo es más reciente, actualizar el mapa
      if (!existingEvent || (eventDate && (!existingDate || eventDate > existingDate))) {
        eventMap.set(key, event);
      }
    });

    return Array.from(eventMap.values());
  }

  function displayEventButtons(events) {
    const eventList = document.querySelector('.event-list');
    eventList.innerHTML = '';

    events.sort((a, b) => {
      const cityComparison = a.Ciudad.localeCompare(b.Ciudad);
      if (cityComparison === 0) {
        return (parseInt(a.Numero) || 0) - (parseInt(b.Numero) || 0);
      }
      return cityComparison;
    });

    if (events.length === 0) {
      eventList.innerHTML = '<p>No hay eventos en este departamento.</p>';
      return;
    }

    events.forEach(row => {
      const eventButton = document.createElement('button');
      eventButton.classList.add('event-button');
      eventButton.textContent = `${row.Ciudad} - ${row.Numero || 'N/A'}`;

      const areAllFieldsEmpty = !row.Telescopio && !row.Accesorios && !row.Horario && !row.Descripción;
      const isAtencionNotEmpty = row.Atención && row.Atención.trim() !== '';

      if (areAllFieldsEmpty) {
        eventButton.style.backgroundColor = 'red';
      } else if (isAtencionNotEmpty) {
        eventButton.style.backgroundColor = '#FFC107';
      }

      eventButton.onclick = function() {
        displayEventDetails(row);
      };
      eventList.appendChild(eventButton);
    });
  }

  function displayEventDetails(event) {
    const eventDetailsContainer = document.querySelector('.event-details');
    eventDetailsContainer.style.display = 'block';
    const numero = event.Numero !== undefined ? event.Numero : 'N/A';
    
    eventDetailsContainer.innerHTML = `
      <p><strong>${event.Ciudad}</strong></p>
      <p><strong>Número:</strong> ${numero}</p>
      <p><strong>Docentes:</strong> ${event.Docentes || 'No disponible'}</p>
      <p><strong>Telescopio:</strong> ${event.Telescopio || 'No disponible'}</p>
      <p><strong>Accesorios:</strong> ${event.Accesorios || 'No disponible'}</p>
      <p><strong>Horario:</strong> ${event.Horario || 'No disponible'}</p>
      <p><strong>Descripción:</strong> ${event.Descripción || 'No disponible'}</p>
      ${event.Fotos ? `<img src="${event.Fotos}" alt="${event.Ciudad}">` : ''}
      <button class="back-button" onclick="hideEventDetails()">Volver</button>
    `;
  }

  function hideEventDetails() {
    document.querySelector('.event-details').style.display = 'none';
  }

  window.onload = getDataFromApi;
</script>
